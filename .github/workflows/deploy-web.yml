# Publishes the Expo web build to GitHub Pages.
#
# Requires Settings -> Pages -> Source: "GitHub Actions" to be selected once.
name: Deploy web

on:
  push:
    branches: [claude/app-build-q70gb7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npm test

      - name: Resolve base path
        id: base
        # A custom domain serves the site from the root; a project repo without
        # one serves it from /<repo>. The presence of a CNAME file is what tells
        # the two apart, so adding a domain needs no workflow change.
        run: |
          if [ -f CNAME ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Custom domain: $(cat CNAME) — building for the site root"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "No CNAME — building for /${{ github.event.repository.name }}"
          fi

      - name: Export web bundle
        # Supabase URL and publishable key come from the committed .env.
        env:
          EXPO_BASE_URL: ${{ steps.base.outputs.path }}
        run: npx expo export --platform web --output-dir dist

      - name: Prepare for Pages
        run: |
          # Expo emits _expo/, and Jekyll skips paths beginning with an underscore.
          touch dist/.nojekyll
          # Pages serves 404.html on a miss; making it the SPA shell is what lets
          # a shared recipe link resolve client-side.
          cp dist/index.html dist/404.html
          # Pages reads the custom domain from CNAME in the published output.
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
